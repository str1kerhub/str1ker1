<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Str1ker Hub</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{--blue:#3b82f6;--blue-lt:#60a5fa;--blue-dark:#1e40af;--cyan:#22d3ee;--glow:#60a5fa;--ice:#a5c8ff;--panel:rgba(8,14,28,0.96);--card:rgba(16,26,48,0.72);--card-hi:rgba(26,42,72,0.88);--side:rgba(4,8,18,0.78);--border:rgba(96,165,250,0.10);--border-hi:rgba(96,165,250,0.30);--white:#f0f4fc;--gray:#8c9cb8;--dim:#3a4a68;--green:#46dc6e;--yellow:#ffc83c;--red:#ff3030}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:radial-gradient(ellipse at 30% 30%,#0a1528 0%,#030510 70%);font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--white);overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;user-select:none}
.ico{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;pointer-events:none}
.ico-sm{width:14px;height:14px}.ico-lg{width:20px;height:20px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
@keyframes popIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes barShrink{from{width:100%}to{width:0%}}
@keyframes loaderGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(59,130,246,0.7))}50%{filter:drop-shadow(0 0 55px rgba(59,130,246,1)) drop-shadow(0 0 30px rgba(34,211,238,0.5))}}
@keyframes fabPulse{0%,100%{box-shadow:0 0 22px rgba(59,130,246,0.5)}50%{box-shadow:0 0 32px rgba(59,130,246,0.9)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bg-glow{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(59,130,246,0.10),transparent 40%),radial-gradient(circle at 85% 80%,rgba(34,211,238,0.08),transparent 45%);pointer-events:none}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(96,165,250,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.watermark{position:fixed;top:12px;left:12px;z-index:900;padding:6px 12px;background:rgba(8,14,28,0.9);border:1px solid rgba(96,165,250,0.3);border-radius:8px;font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--ice);display:flex;align-items:center;gap:8px;animation:pulse 3s ease-in-out infinite;backdrop-filter:blur(10px)}
.watermark .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.key-screen{position:fixed;inset:0;z-index:2000;background:radial-gradient(ellipse at 50% 50%,rgba(59,130,246,0.08),transparent 60%),#030510;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.4s ease}
.key-screen.hide{animation:fadeOut 0.4s ease forwards}
.key-card{width:min(90vw,420px);background:linear-gradient(180deg,rgba(12,20,42,0.98),rgba(8,14,28,0.98));border:1px solid var(--border-hi);border-radius:14px;padding:30px 28px 26px;box-shadow:0 24px 80px rgba(0,0,0,0.9),0 0 80px rgba(59,130,246,0.18);animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.key-card::before{content:'';position:absolute;top:0;left:24px;right:24px;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);border-radius:2px}
.key-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.key-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;box-shadow:0 0 24px rgba(59,130,246,0.6);animation:fabPulse 2.5s ease-in-out infinite}
.key-titles{display:flex;flex-direction:column}
.key-name{font-size:17px;font-weight:900;letter-spacing:1.2px;background:linear-gradient(90deg,#fff,var(--ice));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.key-sub{font-size:10.5px;color:var(--gray);font-weight:600;letter-spacing:0.6px;text-transform:uppercase;margin-top:3px}
.key-sub span{color:var(--ice)}
.key-desc{font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:20px}
.key-input-wrap{position:relative;margin-bottom:10px}
.key-input{width:100%;padding:13px 14px 13px 44px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:10px;color:var(--white);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;outline:none}
.key-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
.key-input::placeholder{color:var(--dim);letter-spacing:0.5px;font-family:inherit}
.key-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none}
.key-btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 20px rgba(59,130,246,0.5);position:relative;overflow:hidden}
.key-btn:disabled{opacity:0.5;cursor:not-allowed}
.key-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transform:translateX(-100%);animation:shimmer 2.5s infinite}
.key-btn.secondary{background:linear-gradient(135deg,rgba(59,130,246,0.18),rgba(30,64,175,0.18));border:1px solid var(--border-hi);color:var(--ice);box-shadow:none;font-size:11.5px;padding:11px}
.key-btn.secondary::after{display:none}
.key-actions{display:flex;flex-direction:column;gap:8px}
.key-status{font-size:11px;margin-top:12px;text-align:center;min-height:16px;color:var(--gray);font-weight:600}
.key-status.error{color:var(--red)}
.key-status.success{color:var(--green)}
.key-status.info{color:var(--ice)}
.key-polling{display:none;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:8px 12px;background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.25);border-radius:8px;font-size:11px;color:var(--ice);font-weight:600}
.key-polling.show{display:flex}
.key-polling .spinner{width:12px;height:12px;border-radius:50%;border:2px solid rgba(96,165,250,0.25);border-top-color:var(--blue);animation:spin 0.8s linear infinite}
.key-footer{text-align:center;margin-top:16px;font-size:11px;color:var(--gray);display:flex;align-items:center;justify-content:space-between;gap:10px}
.key-footer a{color:var(--ice);text-decoration:none;font-weight:700;cursor:pointer}
.key-footer .reset-link{color:var(--dim);font-weight:600}
.puid-badge{display:inline-block;padding:3px 8px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);letter-spacing:0.5px}
.loader-screen{position:fixed;inset:0;z-index:1500;background:radial-gradient(ellipse at 50% 50%,rgba(59,130,246,0.08),transparent 60%),#030510;display:flex;align-items:center;justify-content:center;flex-direction:column}
.loader-screen.hide{animation:fadeOut 0.4s ease forwards}
.loader-logo{font-size:62px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fff,var(--blue-lt),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:loaderGlow 2.5s ease-in-out infinite}
.loader-tag{font-size:11px;color:var(--ice);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-top:8px}
.loader-track{width:340px;max-width:80vw;height:5px;background:rgba(12,20,42,0.9);border-radius:3px;margin-top:44px;overflow:hidden;position:relative;border:1px solid rgba(96,165,250,0.15)}
.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue-dark),var(--blue),var(--cyan));border-radius:3px;box-shadow:0 0 15px rgba(59,130,246,0.7);transition:width 0.1s linear;position:relative}
.loader-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);animation:shimmer 1.5s linear infinite}
.loader-status{width:340px;max-width:80vw;display:flex;justify-content:space-between;margin-top:16px;font-size:11px;color:var(--gray)}
.loader-status .pct{color:var(--glow);font-weight:800}
.panel{position:relative;width:min(94vw,1000px);height:min(86vh,620px);background:var(--panel);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);border-radius:14px;border:1px solid var(--border);box-shadow:0 24px 80px rgba(0,0,0,0.85),0 0 100px rgba(59,130,246,0.10);display:none;flex-direction:column;overflow:hidden}
.panel.show{display:flex;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.panel::before{content:'';position:absolute;top:0;left:40px;right:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(96,165,250,0.6),transparent);pointer-events:none;z-index:2}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(59,130,246,0.05),transparent);flex-shrink:0}
.scale-ctrl{display:flex;align-items:center;gap:10px;flex:1;max-width:300px}
.scale-label{font-size:9.5px;color:var(--gray);text-transform:uppercase;letter-spacing:1.1px;font-weight:700}
.scale-track{flex:1;height:3px;background:rgba(96,165,250,0.12);border-radius:2px;position:relative;cursor:pointer}
.scale-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue-dark),var(--blue));border-radius:2px;box-shadow:0 0 10px rgba(59,130,246,0.6);position:relative}
.scale-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:11px;height:11px;background:#fff;border:2px solid var(--blue);border-radius:50%}
.scale-val{min-width:42px;padding:3px 8px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:6px;text-align:center;font-size:10.5px;font-weight:800;color:var(--glow)}
.topbar-spacer{flex:1}
.win-btns{display:flex;gap:3px}
.win-btn{width:26px;height:26px;border-radius:7px;background:transparent;border:none;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center}
.win-btn:hover{background:rgba(96,165,250,0.10);color:var(--white)}
.body{flex:1;display:flex;overflow:hidden;min-height:0}
.sidebar{width:155px;flex-shrink:0;background:var(--side);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;box-shadow:0 0 18px rgba(59,130,246,0.55)}
.brand-name{font-size:11.5px;font-weight:900;letter-spacing:0.6px;color:#fff}
.brand-sub{font-size:8.5px;color:var(--gray);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-top:2px}
.cat-btn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;border:none;background:transparent;color:var(--gray);font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;position:relative}
.cat-btn:hover{background:rgba(96,165,250,0.06);color:var(--white)}
.cat-btn.active{background:rgba(59,130,246,0.15);color:var(--white);font-weight:600}
.cat-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:55%;background:var(--blue);border-radius:0 2px 2px 0}
.cat-sep{height:1px;background:var(--border);margin:4px 2px}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tabs{display:flex;gap:3px;padding:10px 14px 9px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.22);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:none;background:transparent;color:var(--gray);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--white)}
.tab.active{background:linear-gradient(135deg,rgba(59,130,246,0.35),rgba(30,64,175,0.22));color:var(--white)}
.cards{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:5px;min-height:0}
.cards::-webkit-scrollbar{width:4px}
.cards::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue-dark),var(--blue));border-radius:3px}
.page-head{margin-bottom:8px}
.page-title{font-size:17px;font-weight:800;color:var(--white);margin-bottom:2px}
.page-sub{font-size:11px;color:var(--gray)}
.sec-head{display:flex;align-items:center;gap:7px;padding:8px 2px 3px;font-size:9.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1.3px}
.sec-head::before{content:'';width:2px;height:10px;background:linear-gradient(180deg,var(--blue),var(--blue-dark));border-radius:2px}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.04);border-radius:9px;padding:10px 13px;display:flex;align-items:center;gap:12px;position:relative;cursor:pointer}
.card:hover{background:var(--card-hi);border-color:var(--border-hi)}
.card.static{cursor:default}
.card-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.card-title{font-size:12px;font-weight:700;color:var(--white);line-height:1.2}
.card-desc{font-size:10.5px;color:var(--gray);line-height:1.4}
.card-trailing{display:flex;align-items:center;gap:8px;flex-shrink:0}
.toggle{width:40px;height:22px;border-radius:11px;background:rgba(70,90,120,0.7);border:1px solid rgba(255,255,255,0.06);position:relative;cursor:pointer;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:left 0.22s}
.toggle.on{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
.toggle.on::after{left:calc(100% - 19px)}
.slider-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:220px}
.slider-track{flex:1;height:3px;background:rgba(96,165,250,0.15);border-radius:2px;position:relative;cursor:pointer}
.slider-fill{height:100%;background:linear-gradient(90deg,var(--blue-dark),var(--blue));border-radius:2px;position:relative}
.slider-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#fff;border:2px solid var(--blue);border-radius:50%}
.slider-val{min-width:40px;padding:3px 7px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.05);border-radius:6px;text-align:center;font-size:10.5px;font-weight:800;color:var(--glow)}
.dropdown{display:flex;align-items:center;gap:6px;padding:5px 9px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.06);border-radius:7px;cursor:pointer;font-size:10.5px;font-weight:700;color:var(--white);flex-shrink:0;min-width:90px;justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase}
.badge.auto{background:rgba(70,220,110,0.12);border:1px solid rgba(70,220,110,0.35);color:var(--green)}
.badge.required{background:rgba(59,130,246,0.14);border:1px solid rgba(59,130,246,0.4);color:var(--glow)}
.char-panel{width:210px;flex-shrink:0;background:linear-gradient(180deg,rgba(10,20,42,0.5),rgba(3,5,16,0.9));border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.char-label{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:9.5px;color:rgba(200,215,235,0.55);letter-spacing:2.5px;text-transform:uppercase;font-weight:700;white-space:nowrap}
.char-change-btn{position:absolute;top:12px;right:12px;padding:5px 10px;background:rgba(59,130,246,0.18);border:1px solid rgba(96,165,250,0.4);border-radius:7px;color:var(--ice);font-size:10px;font-weight:700;font-family:inherit;cursor:pointer}
.fab{position:fixed;left:18px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-dark));border:1.5px solid rgba(96,165,250,0.5);color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(59,130,246,0.5);z-index:50;font-size:22px;font-weight:900}
.fab.show{display:flex}
.notifs{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:500;max-width:300px;pointer-events:none}
.notif{background:rgba(8,14,28,0.96);border:1px solid var(--border);border-radius:10px;padding:11px 13px 13px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 12px 36px rgba(0,0,0,0.6);pointer-events:auto;min-width:240px}
.notif-icon{width:26px;height:26px;border-radius:50%;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;color:var(--glow);flex-shrink:0}
.notif.success .notif-icon{background:rgba(70,220,110,0.15);border-color:rgba(70,220,110,0.4);color:var(--green)}
.notif.warn .notif-icon{background:rgba(255,200,60,0.15);border-color:rgba(255,200,60,0.4);color:var(--yellow)}
.notif.error .notif-icon{background:rgba(255,48,48,0.15);border-color:rgba(255,48,48,0.4);color:var(--red)}
.notif-title{font-size:11.5px;font-weight:700;color:var(--white)}
.notif-msg{font-size:10.5px;color:var(--gray);line-height:1.4}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.popup{background:linear-gradient(180deg,rgba(12,20,42,0.98),rgba(8,14,28,0.98));border:1px solid var(--border-hi);border-radius:12px;padding:20px 22px 18px;min-width:290px;max-width:380px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,0.9)}
.popup-icon{width:40px;height:40px;border-radius:50%;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;color:var(--glow);margin-bottom:12px}
.popup-icon.warn{background:rgba(255,200,60,0.15);border-color:rgba(255,200,60,0.4);color:var(--yellow)}
.popup-title{font-size:15px;font-weight:800;color:var(--white);margin-bottom:5px}
.popup-msg{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:16px}
.popup-input{width:100%;padding:9px 11px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:inherit;font-size:12px;margin-bottom:14px;outline:none}
.popup-actions{display:flex;gap:8px;justify-content:flex-end}
.popup-btn{padding:8px 16px;border-radius:8px;border:1px solid transparent;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;min-width:76px}
.popup-btn.cancel{background:rgba(50,70,100,0.5);color:var(--gray)}
.popup-btn.confirm{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}
@media (max-width:800px){.char-panel{display:none}.panel{width:98vw;height:94vh}.sidebar{width:140px}}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="watermark" id="watermark" style="display:none">
  <span class="dot"></span>
  <span>STR1KER · v3.0 · FREE</span>
</div>

<div class="key-screen" id="keyScreen">
  <div class="key-card">
    <div class="key-brand">
      <div class="key-logo">S</div>
      <div class="key-titles">
        <div class="key-name">STR1KER HUB</div>

let currentCat = 'Aimbot';

function renderCats() {
  catNavEl.innerHTML = '';
  const top = ['Aimbot','Combat','Visuals','Movement','Fruits'];
  const bot = ['Misc','Webhook','Settings'];
  const mk = (key) => {
    const btn = document.createElement('button');

    btn.dataset.cat = key;
    btn.textContent = key;
    btn.onclick = () => switchCat(key);
    return btn;
  };
  top.forEach(k => catNavEl.appendChild(mk(k)));
  const sep = document.createElement('div'); sep.className = 'cat-sep'; catNavEl.appendChild(sep);
  bot.forEach(k => catNavEl.appendChild(mk(k)));
}

function renderTabs() {
  tabsEl.innerHTML = '';
  DATA[currentCat].tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t === currentTab ? ' active' : '');
    btn.textContent = t;
    btn.onclick = () => { currentTab = t; renderTabs(); renderCards(); };
    tabsEl.appendChild(btn);
  });
}

function renderCards() {
  cardsEl.innerHTML = '';
  const page = DATA[currentCat].content[currentTab];
  if (!page) return;
  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `<div class="page-title">${currentTab}</div><div class="page-sub">${page.sub||''}</div>`;
  cardsEl.appendChild(head);

  page.sections.forEach(sec => {
    const sh = document.createElement('div');
    sh.className = 'sec-head';
    sh.textContent = sec.title;
    cardsEl.appendChild(sh);

    sec.cards.forEach(card => {
      const el = document.createElement('div');
      if (card.t === 'toggle') {
        el.className = 'card';
        el.innerHTML = `<div class="card-body"><div class="card-title">${card.title}</div><div class="card-desc">${card.desc||''}</div></div><div class="card-trailing"><div class="toggle ${card.on?'on':''}"></div></div>`;
        const tg = el.querySelector('.toggle');
        el.onclick = () => {
          tg.classList.toggle('on');
          const on = tg.classList.contains('on');
          card.on = on;
          showNotif(card.title, on?'Enabled':'Disabled', on?'success':'info');
        };
      } else if (card.t === 'slider') {
        el.className = 'card static';
        const isDec = card.max <= 2;
        const pct = ((card.value - card.min) / (card.max - card.min)) * 100;
        el.innerHTML = `<div class="card-body"><div class="card-title">${card.title}</div><div class="card-desc">${card.desc||''}</div></div><div class="card-trailing"><div class="slider-wrap"><div class="slider-track" data-min="${card.min}" data-max="${card.max}" data-decimal="${isDec}"><div class="slider-fill" style="width:${pct}%"></div></div><div class="slider-val">${isDec?card.value.toFixed(2):card.value}</div></div></div>`;
        attachSlider(el);
      } else if (card.t === 'dropdown') {
        el.className = 'card';
        el.innerHTML = `<div class="card-body"><div class="card-title">${card.title}</div><div class="card-desc">${card.desc||''}</div></div><div class="card-trailing"><div class="dropdown">${card.value} ▾</div></div>`;
        el.onclick = () => showDropdown(card);
      } else if (card.t === 'locked') {
        el.className = 'card static';
        el.innerHTML = `<div class="card-body"><div class="card-title">${card.title}</div><div class="card-desc">${card.desc||''}</div></div><div class="card-trailing"><span class="badge ${card.badgeClass}">${card.badge}</span></div>`;
      } else {
        el.className = 'card';
        el.innerHTML = `<div class="card-body"><div class="card-title">${card.title}</div><div class="card-desc">${card.desc||''}</div></div><div class="card-trailing">›</div>`;
        el.onclick = () => { if (card.action) card.action(); else showNotif(card.title,'Done','success'); };
      }
      cardsEl.appendChild(el);
    });
  });
}

function attachSlider(el) {
  const track = el.querySelector('.slider-track');
  const fill = el.querySelector('.slider-fill');
  const val = el.querySelector('.slider-val');
  const min = +track.dataset.min, max = +track.dataset.max;
  const isDec = track.dataset.decimal === 'true';
  const set = (x) => {
    const r = track.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (x - r.left) / r.width));
    const v = min + (max - min) * rel;
    fill.style.width = (rel*100)+'%';
    val.textContent = isDec ? v.toFixed(2) : Math.round(v);
  };
  const down = (e) => {
    e.stopPropagation();
    set(e.touches?e.touches[0].clientX:e.clientX);
    const move = (ev) => set(ev.touches?ev.touches[0].clientX:ev.clientX);
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); window.removeEventListener('touchmove',move); window.removeEventListener('touchend',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
    window.addEventListener('touchmove',move,{passive:true}); window.addEventListener('touchend',up);
  };
  track.addEventListener('mousedown',down);
  track.addEventListener('touchstart',down,{passive:true});
  el.addEventListener('click', e => e.stopPropagation());
}

function showDropdown(card) {
  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.className='popup-overlay';
  ov.onclick = e => { if (e.target===ov) ov.remove(); };
  const p = document.createElement('div'); p.className='popup';
  p.innerHTML = `<div class="popup-title">${card.title}</div>`;
  card.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'popup-btn';
    b.style.cssText = 'display:block;width:100%;margin-bottom:6px;' + (opt===card.value ? 'background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;' : 'background:rgba(50,70,100,0.4);color:var(--white);');
    b.textContent = opt;
    b.onclick = () => { card.value = opt; renderCards(); ov.remove(); showNotif(card.title,'→ '+opt,'success'); };
    p.appendChild(b);
  });
  ov.appendChild(p);
  document.body.appendChild(ov);
}

  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();

  const p = document.createElement('div'); p.className='popup';
  p.innerHTML = `<div class="popup-icon warn">!</div><div class="popup-title">${title}</div><div class="popup-msg">${msg}</div><div class="popup-actions"><button class="popup-btn cancel">Cancel</button><button class="popup-btn confirm">Confirm</button></div>`;
  ov.appendChild(p); document.body.appendChild(ov);
  p.querySelector('.cancel').onclick = () => ov.remove();
  p.querySelector('.confirm').onclick = () => { ov.remove(); if (onYes) onYes(); };
}

function askPrompt(title, placeholder, onSubmit) {
  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.className='popup-overlay';
  const p = document.createElement('div'); p.className='popup';
  p.innerHTML = `<div class="popup-title">${title}</div><input class="popup-input" id="pInput" placeholder="${placeholder}"><div class="popup-actions"><button class="popup-btn cancel">Cancel</button><button class="popup-btn confirm">OK</button></div>`;
  ov.appendChild(p); document.body.appendChild(ov);
  const inp = p.querySelector('#pInput');
  setTimeout(()=>inp.focus(),100);
  const ok = () => { const v=inp.value.trim(); if(v&&onSubmit) onSubmit(v); ov.remove(); };
  inp.addEventListener('keydown', e => { if(e.key==='Enter') ok(); });
  p.querySelector('.cancel').onclick = () => ov.remove();
  p.querySelector('.confirm').onclick = ok;
}

function showKeyPopup(key, onClose) {
  const ov = document.createElement('div');
  ov.className = 'popup-overlay';
  ov.innerHTML = `<div class="popup" style="max-width:420px">
    <div class="popup-icon" style="background:rgba(70,220,110,0.15);border-color:rgba(70,220,110,0.4);color:var(--green)">✓</div>

    <div class="popup-actions">
      <button class="popup-btn cancel" id="pCopy">Copiar</button>
      <button class="popup-btn confirm" id="pOk">Entrar no Hub</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector('#keyResult');
  ov.querySelector('#pCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(key); showNotif('Key','Copiada','success'); }
    catch(_) { inp.select(); document.execCommand('copy'); showNotif('Key','Copiada','success'); }
  };
  ov.querySelector('#pOk').onclick = () => { ov.remove(); if (onClose) onClose(); };
}

function promptAvatarChange() { showNotif('Avatar','Not available in preview','info'); }

const scaleTrack = document.getElementById('scaleTrack');
const scaleFill = document.getElementById('scaleFill');
const scaleVal = document.getElementById('scaleVal');

function applyScale(rel) {
  rel = Math.max(0.40, Math.min(0.90, rel));
  const w = Math.round(100 + rel * 1150);
  const h = Math.round(w * 0.62);
  panelEl.style.width = w + 'px';
  panelEl.style.height = h + 'px';
  scaleFill.style.width = ((rel - 0.40) / 0.50 * 100) + '%';
  scaleVal.textContent = Math.round(rel*100) + '%';
}

let scaleDrag = false;
const scaleSet = (x) => {
  const r = scaleTrack.getBoundingClientRect();
  applyScale(0.40 + Math.max(0, Math.min(1, (x - r.left) / r.width)) * 0.50);
};
scaleTrack.addEventListener('mousedown', e => { e.stopPropagation(); scaleDrag = true; scaleSet(e.clientX); });
scaleTrack.addEventListener('touchstart', e => { e.stopPropagation(); scaleDrag = true; scaleSet(e.touches[0].clientX); }, {passive:true});
window.addEventListener('mousemove', e => { if (scaleDrag) scaleSet(e.clientX); });
window.addEventListener('mouseup', () => { scaleDrag = false; });
window.addEventListener('touchmove', e => { if (scaleDrag) scaleSet(e.touches[0].clientX); }, {passive:true});
window.addEventListener('touchend', () => { scaleDrag = false; });

document.getElementById('closeBtn').onclick = () => {
  askConfirm('Unload Hub','Close the panel?', () => {
    panelEl.style.display = 'none';
    document.getElementById('fab').classList.add('show');
    document.getElementById('watermark').style.display = 'none';
  });
};
document.getElementById('minBtn').onclick = () => {
  panelEl.style.display = 'none';
  document.getElementById('fab').classList.add('show');
};
document.getElementById('fab').onclick = () => {
  panelEl.style.display = 'flex';
  document.getElementById('fab').classList.remove('show');
};

const keyScreen = document.getElementById('keyScreen');
const loaderScreen = document.getElementById('loaderScreen');
const keyInput = document.getElementById('keyInput');
const keyBtn = document.getElementById('keyBtn');
const getKeyBtn = document.getElementById('getKeyBtn');
const keyStatus = document.getElementById('keyStatus');
const keyPolling = document.getElementById('keyPolling');
const pollingText = document.getElementById('pollingText');
const puidBadge = document.getElementById('puidBadge');
const resetKeyLink = document.getElementById('resetKeyLink');

puidBadge.textContent = PUID;

function setStatus(txt, cls) {
  keyStatus.textContent = txt;
  keyStatus.className = 'key-status' + (cls ? ' ' + cls : '');
}

async function apiValidate(key) {
  try {
    const res = await fetch(CFG.API + '/validate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({key})
    });
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

async function apiGetKeyByIP() {
  try {
    const res = await fetch(CFG.API + '/get-key-by-ip');
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

function startLoader() {
  keyScreen.classList.add('hide');
  setTimeout(() => { keyScreen.style.display = 'none'; }, 400);
  loaderScreen.style.display = 'flex';

  const DUR = 4500;
  const start = performance.now();
  const steps = [
    {at:0, t:'initializing'},
    {at:12, t:'verifying key'},
    {at:30, t:'loading modules'},
    {at:55, t:'injecting bypass'},
    {at:78, t:'connecting api'},
    {at:92, t:'finalizing'},
  ];
  const fillEl = document.getElementById('loaderFill');
  const pctEl = document.getElementById('loaderPct');
  const stEl = document.getElementById('loaderStatus');

  function tick() {
    const p = Math.min(1, (performance.now() - start) / DUR);
    fillEl.style.width = (p*100)+'%';
    pctEl.textContent = Math.floor(p*100)+'%';
    let s = 'initializing';
    for (const x of steps) if (p*100 >= x.at) s = x.t;
    stEl.textContent = s;
    if (p < 1) requestAnimationFrame(tick);
    else {
      setTimeout(() => {
        loaderScreen.classList.add('hide');
        setTimeout(() => {
          loaderScreen.style.display = 'none';
          panelEl.style.display = 'flex';
          panelEl.classList.add('show');
          document.getElementById('fab').classList.add('show');
          document.getElementById('watermark').style.display = 'flex';
          showNotif('Str1ker Hub','Hub loaded','success');
        }, 400);
      }, 300);
    }
  }
  requestAnimationFrame(tick);
}

async function tryUnlock(key) {
  setStatus('Validando...', 'info');
  keyBtn.disabled = true;
  const r = await apiValidate(key);
  keyBtn.disabled = false;
  if (r && r.valid) {
    localStorage.setItem(CFG.KEY_LS, key);
    setStatus('Key válida!','success');
    setTimeout(startLoader, 400);
  } else {
    if (r === null) setStatus('Erro de conexão','error');
    else setStatus('Key inválida','error');
  }
}

keyBtn.onclick = () => {
  const k = keyInput.value.trim();
  if (!k) return setStatus('Digite uma key','error');
  tryUnlock(k);
};
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') keyBtn.click(); });

let pollTimer = null;
getKeyBtn.onclick = async () => {
  if (pollTimer) return;

  let sessionToken = null;
  try {
    const reg = await fetch(CFG.API + '/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({puid: PUID})
    });
    if (reg.ok) {
      const regData = await reg.json();
      sessionToken = regData.token;
      sessionStorage.setItem('str1ker_token', sessionToken);
    }
  } catch(_) {}

  if (!sessionToken) {
    setStatus('Erro ao registrar sessão', 'error');
    return;
  }

  const url = CFG.LOOTLABS + '&sub_id=' + encodeURIComponent(PUID);
  try { await navigator.clipboard.writeText(url); } catch(_) {}
  window.open(url, '_blank');

  keyPolling.classList.add('show');
  pollingText.textContent = 'Aguardando task... (0s)';
  setStatus('Complete a task','info');
  getKeyBtn.disabled = true;

  const start = Date.now();
  pollTimer = setInterval(async () => {
    const el = Math.floor((Date.now() - start) / 1000);
    pollingText.textContent = `Aguardando task... (${el}s)`;
    const tok = sessionStorage.getItem('str1ker_token') || '';
    let r = null;
    try {
      const rr = await fetch(CFG.API + '/get-key-by-ip?token=' + encodeURIComponent(tok));
      r = await rr.json();
    } catch(_) {}
    if (r && r.found && r.key) {
      clearInterval(pollTimer); pollTimer = null;
      keyPolling.classList.remove('show');
      keyInput.value = r.key;
      localStorage.setItem(CFG.KEY_LS, r.key);
      setStatus('Key recebida!','success');
      getKeyBtn.disabled = false;
      setTimeout(() => showKeyPopup(r.key, () => startLoader()), 300);
      return;
    }
    if (el >= 300) {
      clearInterval(pollTimer); pollTimer = null;
      keyPolling.classList.remove('show');
      getKeyBtn.disabled = false;
      setStatus('Tempo esgotado','error');
    }
  }, 3000);
};
resetKeyLink.onclick = () => {
  askConfirm('Reset','Apaga key e PUID?', () => {
    localStorage.removeItem(CFG.KEY_LS);
    localStorage.removeItem(CFG.PUID_LS);
    location.reload();
  });
};

applyScale(0.40);
renderCats();
renderTabs();
renderCards();

(async () => {
  const saved = localStorage.getItem(CFG.KEY_LS);
  if (saved) {
    const v = await apiValidate(saved);
    if (v && v.valid) {
      setStatus('Key salva válida','success');
      setTimeout(startLoader, 400);
      return;
    }
    localStorage.removeItem(CFG.KEY_LS);
  }
  await new Promise(r => setTimeout(r, 400));
  const r = await apiGetKeyByIP();
  if (r && r.found && r.key) {
    keyInput.value = r.key;
    localStorage.setItem(CFG.KEY_LS, r.key);
    setStatus('Key encontrada!','success');
    setTimeout(() => showKeyPopup(r.key, () => startLoader()), 500);
  } else {
    setStatus('Cole uma key ou clique em Pegar Key','info');
  }
})();
</script>
