<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Str1ker Hub</title>
<style>
  :root {
    --bg-deep: #050810;
    --bg-panel: rgba(8, 14, 28, 0.96);
    --bg-sidebar: rgba(4, 8, 18, 0.85);
    --bg-card: rgba(16, 26, 48, 0.75);
    --bg-card-hover: rgba(26, 42, 72, 0.9);
    --border: rgba(96, 165, 250, 0.10);
    --border-hi: rgba(96, 165, 250, 0.32);
    --accent: #3b82f6;
    --accent-lt: #60a5fa;
    --accent-dark: #1e40af;
    --cyan: #22d3ee;
    --text: #f0f4fc;
    --text-dim: #8c9cb8;
    --text-muted: #3a4a68;
    --green: #46dc6e;
    --yellow: #ffc83c;
    --red: #ff3030;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%;
    background: radial-gradient(ellipse at 30% 30%, #0a1528 0%, #030510 70%);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .ico { width:16px; height:16px; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; flex-shrink:0; pointer-events:none; }
  .ico-sm { width:14px; height:14px; }
  .ico-lg { width:20px; height:20px; }

  @keyframes popIn       { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
  @keyframes popOut      { to   { opacity:0; transform:scale(0.94); } }
  @keyframes fadeIn      { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeOut     { to   { opacity:0; visibility:hidden; } }
  @keyframes slideUp     { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideRight  { from { opacity:0; transform:translateX(50px) scale(0.96); } to { opacity:1; transform:translateX(0) scale(1); } }
  @keyframes slideOut    { to   { opacity:0; transform:translateX(50px) scale(0.96); } }
  @keyframes pulse       { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  @keyframes float       { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes barShrink   { from { width:100%; } to { width:0%; } }
  @keyframes shimmer     { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
  @keyframes rowIn       { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
  @keyframes rowOut      { from { opacity:1; transform:translateX(0); max-height:32px; } to { opacity:0; transform:translateX(-8px); max-height:0; } }
  @keyframes pulseDot    { 0%,100% { opacity:0.4; transform:scale(0.9); } 50% { opacity:1; transform:scale(1.15); } }
  @keyframes glowPulse   { 0%,100% { filter:drop-shadow(0 0 20px rgba(59,130,246,0.6)); } 50% { filter:drop-shadow(0 0 40px rgba(59,130,246,1)) drop-shadow(0 0 20px rgba(34,211,238,0.5)); } }
  @keyframes scaleIn     { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }

  /* ═══════════════ LOADER ═══════════════ */
  .loader-stage {
    position: fixed; inset:0; z-index:1500;
    background: radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.10), transparent 60%), #030510;
    display: none; align-items: center; justify-content: center; flex-direction: column;
  }
  .loader-stage.show { display: flex; animation: fadeIn 0.5s ease; }
  .loader-stage.hide { animation: fadeOut 0.5s ease forwards; }
  .loader-card {
    width: min(92vw, 640px);
    height: min(88vh, 500px);
    background: linear-gradient(180deg, rgba(12,20,42,0.98), rgba(8,14,28,0.98));
    border: 1px solid rgba(96,165,250,0.18);
    border-radius: 20px;
    padding: 28px 30px 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.85), 0 0 100px rgba(59,130,246,0.15);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .loader-card::before {
    content: ''; position: absolute; top:0; left:32px; right:32px; height:1px;
    background: linear-gradient(90deg, transparent, rgba(96,165,250,0.9), transparent);
  }

  .loader-head { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; flex-shrink: 0; }
  .loader-logo {
    width: 56px; height: 56px; border-radius: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 26px; color: #fff;
    box-shadow: 0 0 30px rgba(59,130,246,0.6);
    flex-shrink: 0;
    animation: glowPulse 2.5s ease-in-out infinite;
    overflow: hidden;
  }
  .loader-logo img { width: 100%; height: 100%; object-fit: contain; }
  .loader-title { font-size: 19px; font-weight: 900; letter-spacing: 0.3px; color: #fff; }
  .loader-tag { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; margin-top: 4px; }
  .loader-badge {
    margin-left: auto;
    padding: 8px 15px;
    border: 1px solid rgba(70,220,110,0.5);
    background: rgba(70,220,110,0.08);
    border-radius: 999px;
    font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    color: var(--green); text-transform: uppercase;
    display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  }
  .loader-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 10px var(--green);
    animation: pulseDot 1.8s ease-in-out infinite;
  }

  .loader-statusrow {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; gap: 12px; flex-shrink: 0;
  }
  .loader-statustext { font-size: 14.5px; font-weight: 600; color: var(--text); transition: color 0.3s; }
  .loader-pct { font-size: 15px; font-weight: 800; color: var(--accent-lt); font-family: 'JetBrains Mono', monospace; }
  .loader-track {
    width: 100%; height: 5px;
    background: rgba(12,20,42,0.9);
    border-radius: 3px; overflow: hidden;
    margin-bottom: 26px; flex-shrink: 0;
    border: 1px solid rgba(96,165,250,0.08);
    position: relative;
  }
  .loader-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--cyan));
    border-radius: 3px; position: relative;
    transition: width 0.3s cubic-bezier(0.34,1.2,0.64,1);
    box-shadow: 0 0 15px rgba(59,130,246,0.8);
  }
  .loader-fill::after {
    content: ''; position: absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 1.8s linear infinite;
  }

  .activity-box {
    background: rgba(4,8,18,0.6);
    border: 1px solid rgba(96,165,250,0.10);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
    height: 220px; overflow: hidden;
    position: relative; flex: 1; min-height: 0;
  }
  .activity-box::before {
    content: ''; position: absolute; top:0; left:0; right:0; height:26px;
    background: linear-gradient(180deg, rgba(4,8,18,1), rgba(4,8,18,0));
    z-index: 2; pointer-events: none;
    border-top-left-radius: 12px; border-top-right-radius: 12px;
  }
  .activity-title {
    font-size: 10px; font-weight: 800; letter-spacing: 2px;
    color: var(--text-muted); text-transform: uppercase;
    margin-bottom: 14px; position: sticky; top: 0;
  }
  .activity-list {
    display: flex; flex-direction: column; gap: 10px;
    justify-content: flex-end; min-height: 0;
    height: calc(100% - 26px); overflow: hidden;
  }
  .activity-row {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 12.5px; color: var(--text-dim); line-height: 1.4;
    animation: rowIn 0.35s ease both; flex-shrink: 0;
  }
  .activity-row .adot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0; margin-top: 6px;
    box-shadow: 0 0 8px var(--accent);
  }
  .activity-row.done .adot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .activity-row.active .adot {
    background: var(--accent-lt); box-shadow: 0 0 12px var(--accent-lt);
    animation: pulseDot 1.2s ease-in-out infinite;
  }
  .activity-row.done { color: #a8b8d0; }
  .activity-row.leaving { animation: rowOut 0.35s ease forwards; overflow: hidden; }

  .loader-footer {
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--text-dim); font-weight: 600; flex-shrink: 0;
  }
  .loader-footer .fdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 10px var(--green);
    animation: pulseDot 2s ease-in-out infinite;
  }

  /* ═══════════════ APP ═══════════════ */
  .app {
    position: relative;
    width: min(96vw, 1180px);
    height: min(90vh, 720px);
    background: var(--bg-panel);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 24px 80px rgba(0,0,0,0.85), 0 0 100px rgba(59,130,246,0.08);
    display: none;
    flex-direction: column; overflow: hidden;
  }
  .app.show { display: flex; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  .app.hide { animation: popOut 0.3s ease forwards; }
  .app::before {
    content: ''; position: absolute; top:0; left:40px; right:40px; height:1px;
    background: linear-gradient(90deg, transparent, rgba(96,165,250,0.6), transparent);
    pointer-events: none; z-index: 2;
  }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(59,130,246,0.05), transparent);
    flex-shrink: 0; position: relative;
  }
  .topbar::after {
    content: ''; position: absolute; bottom:-1px; left:20px; right:20px; height:1px;
    background: linear-gradient(90deg, rgba(96,165,250,0.3), transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 17px; color: #fff;
    box-shadow: 0 0 22px rgba(59,130,246,0.5);
    flex-shrink: 0;
    overflow: hidden;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name {
    font-size: 14px; font-weight: 900; letter-spacing: 0.8px;
    background: linear-gradient(90deg, #fff, #a5c8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1.1;
  }
  .brand-sub {
    font-size: 9px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px;
  }

  .topbar-spacer { flex: 1; }

  .lang-switch {
    display: flex; align-items: center; gap: 2px;
    padding: 3px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .lang-btn {
    padding: 4px 9px;
    background: transparent; border: none;
    color: var(--text-dim); font-family: inherit;
    font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
    border-radius: 5px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn.active { background: rgba(59,130,246,0.25); color: var(--accent-lt); }
  .lang-btn:hover:not(.active) { color: var(--text); }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 6px;
    background: rgba(59,130,246,0.10);
    border: 1px solid rgba(96,165,250,0.25);
    border-radius: 999px;
    font-size: 11px; font-weight: 700; color: var(--text);
  }
  .user-chip img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: rgba(59,130,246,0.2); }

  .win-btns { display: flex; gap: 4px; }
  .win-btn {
    width: 28px; height: 28px; border-radius: 8px;
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .win-btn:hover { background: rgba(96,165,250,0.10); color: var(--text); }
  .win-btn.close:hover { background: rgba(255,48,48,0.15); color: var(--red); }

  .body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  .sidebar {
    width: 180px; flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 0; }
  .cat-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--text-dim); font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; text-align: left; width: 100%;
    transition: background 0.15s, color 0.15s, transform 0.15s;
    position: relative;
  }
  .cat-btn:hover { background: rgba(96,165,250,0.06); color: var(--text); transform: translateX(2px); }
  .cat-btn.active { background: rgba(59,130,246,0.15); color: var(--text); font-weight: 600; }
  .cat-btn.active::before {
    content: ''; position: absolute; left:0; top:50%; transform: translateY(-50%);
    width: 2px; height: 55%; background: var(--accent); border-radius: 0 2px 2px 0;
    box-shadow: 0 0 10px var(--accent);
  }
  .cat-btn.active .ico { color: var(--accent-lt); }
  .cat-sep { height:1px; background: var(--border); margin: 6px 4px; }

  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .tabs {
    display: flex; gap: 4px; padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.20);
    overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--text-dim); font-family: inherit; font-size: 11px; font-weight: 600;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: background 0.2s, color 0.2s, transform 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(30,64,175,0.22));
    color: var(--text);
    box-shadow: 0 0 14px rgba(59,130,246,0.32);
    animation: scaleIn 0.2s ease;
  }
  .tab.active .ico { color: var(--accent-lt); }

  .cards {
    flex: 1; overflow-y: auto; padding: 18px 20px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 0;
  }
  .cards::-webkit-scrollbar { width: 4px; }
  .cards::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-dark), var(--accent)); border-radius: 3px; }

  .page-head { margin-bottom: 12px; animation: slideUp 0.35s ease; }
  .page-title { font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; margin-bottom: 3px; }
  .page-sub { font-size: 11.5px; color: var(--text-dim); }

  .sec-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 2px 5px;
    font-size: 9.5px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1.4px;
  }
  .sec-head::before {
    content: ''; width: 2px; height: 11px;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    border-radius: 2px; box-shadow: 0 0 8px var(--accent);
  }

  .card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 12px 15px;
    display: flex; align-items: center; gap: 14px;
    position: relative; overflow: hidden;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
    cursor: pointer;
    animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1) backwards;
  }
  .card::before {
    content: ''; position: absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(96,165,250,0.08), transparent);
    transform: translateX(-100%); transition: transform 0.7s; pointer-events: none;
  }
  .card::after {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 2px; height: 0;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    border-radius: 0 2px 2px 0; box-shadow: 0 0 10px var(--accent);
    transition: height 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .card:hover::before { transform: translateX(100%); }
  .card:hover::after { height: 65%; }
  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hi);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), 0 0 20px rgba(59,130,246,0.12);
  }
  .card.static { cursor: default; }
  .card.static::after { display: none; }
  .card.static:hover { transform: none; }

  .card-body { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-title { font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .card-desc { font-size: 10.5px; color: var(--text-dim); line-height: 1.4; }
  .card-trailing { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .toggle {
    width: 42px; height: 23px; border-radius: 12px;
    background: rgba(70,90,120,0.7);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative; cursor: pointer; flex-shrink: 0;
    transition: background 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 17px; height: 17px; background: #fff; border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    transition: left 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toggle.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(59,130,246,0.6);
  }
  .toggle.on::after { left: calc(100% - 19px); }

  .slider-wrap { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 200px; }
  .slider-track {
    flex: 1; height: 3px; background: rgba(96,165,250,0.15);
    border-radius: 2px; position: relative; cursor: pointer;
  }
  .slider-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    border-radius: 2px; position: relative;
    box-shadow: 0 0 8px rgba(59,130,246,0.6);
    transition: width 0.1s linear;
  }
  .slider-fill::after {
    content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 11px; height: 11px; background: #fff;
    border: 2px solid var(--accent); border-radius: 50%;
    box-shadow: 0 0 10px rgba(59,130,246,0.9);
    transition: transform 0.15s;
  }
  .slider-track:hover .slider-fill::after { transform: translateY(-50%) scale(1.15); }
  .slider-val {
    min-width: 42px; padding: 3px 8px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 6px; text-align: center;
    font-size: 10.5px; font-weight: 800; color: var(--accent-lt);
    font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
  }

  .dropdown {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 7px; cursor: pointer;
    font-size: 10.5px; font-weight: 700; color: var(--text);
    flex-shrink: 0; min-width: 110px; justify-content: space-between;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropdown:hover { border-color: var(--border-hi); background: rgba(96,165,250,0.10); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 6px;
    font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge.auto { background: rgba(70,220,110,0.12); border: 1px solid rgba(70,220,110,0.35); color: var(--green); }
  .badge.required { background: rgba(59,130,246,0.14); border: 1px solid rgba(59,130,246,0.4); color: var(--accent-lt); }
  .badge.pro { background: rgba(165,200,255,0.15); border: 1px solid rgba(165,200,255,0.4); color: #a5c8ff; }

  .avatar-panel {
    width: 250px; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(10,20,42,0.5), rgba(3,5,16,0.9));
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;

function attachSlider(el) {
  const track = el.querySelector('.slider-track');
  const fill = el.querySelector('.slider-fill');
  const val = el.querySelector('.slider-val');
  const min = +track.dataset.min, max = +track.dataset.max;
  const isDec = track.dataset.decimal === 'true';
  const set = x => {
    const r = track.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (x - r.left) / r.width));
    const v = min + (max - min) * rel;
    fill.style.width = (rel * 100) + '%';
    val.textContent = isDec ? v.toFixed(2) : Math.round(v);
  };
  const down = e => {
    e.stopPropagation();
    set(e.touches ? e.touches[0].clientX : e.clientX);
    const move = ev => set(ev.touches ? ev.touches[0].clientX : ev.clientX);
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, {passive:true}); window.addEventListener('touchend', up);
  };
  track.addEventListener('mousedown', down);
  track.addEventListener('touchstart', down, {passive:true});
  el.addEventListener('click', e => e.stopPropagation());
}

function showDropdown(card) {
  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.className = 'popup-overlay';
  ov.onclick = e => { if (e.target === ov) closePopup(ov); };
  const p = document.createElement('div'); p.className = 'popup';
  p.innerHTML = `<div class="popup-title">${card.title}</div><div class="popup-msg">${card.desc || ''}</div><div id="ddOpts"></div>`;
  const opts = p.querySelector('#ddOpts');
  card.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'popup-btn';
    b.style.cssText = 'display:block;width:100%;margin-bottom:6px;' + (opt === card.value ? 'background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;' : 'background:rgba(50,70,100,0.4);color:var(--text);');
    b.textContent = opt;
    b.onclick = () => { card.value = opt; renderCards(); closePopup(ov); showNotif(card.title, t('setTo', {v:opt}), 'success'); };
    opts.appendChild(b);
  });
  ov.appendChild(p); document.body.appendChild(ov);
}

function switchCat(cat) {
  currentCat = cat;
  currentTab = DATA[cat].tabs[0].name;
  document.querySelectorAll('.cat-btn').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  renderTabs(); renderCards();
}

function showNotif(title, msg, kind) {
  kind = kind || 'info';
  const holder = document.getElementById('notifs');
  const el = document.createElement('div');
  el.className = 'notif ' + kind;
  let icoId = 'i-check';
  if (kind === 'warn') icoId = 'i-alert';
  if (kind === 'info') icoId = 'i-info';
  if (kind === 'error') icoId = 'i-x';
  el.innerHTML = `<div class="notif-icon">${icon(icoId, 'ico-sm')}</div><div class="notif-body"><div class="notif-title">${title}</div><div class="notif-msg">${msg}</div></div><div class="notif-bar"><div class="notif-bar-fill"></div></div>`;
  holder.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 4000);
}

function closePopup(ov) {
  ov.classList.add('closing');
  setTimeout(() => ov.remove(), 200);
}

function askConfirm(title, msg, onYes) {
  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.className = 'popup-overlay';
  const p = document.createElement('div'); p.className = 'popup';
  p.innerHTML = `<div class="popup-icon warn">${icon('i-alert','ico-lg')}</div><div class="popup-title">${title}</div><div class="popup-msg">${msg}</div><div class="popup-actions"><button class="popup-btn cancel" id="pC">${t('cancel')}</button><button class="popup-btn confirm" id="pK">${t('confirm')}</button></div>`;
  ov.appendChild(p); document.body.appendChild(ov);
  p.querySelector('#pC').onclick = () => closePopup(ov);
  p.querySelector('#pK').onclick = () => { closePopup(ov); if (onYes) onYes(); };
}

function askPrompt(title, placeholder, onSubmit) {
  const ex = document.querySelector('.popup-overlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.className = 'popup-overlay';
  const p = document.createElement('div'); p.className = 'popup';
  p.innerHTML = `<div class="popup-title">${title}</div><input class="popup-input" id="pInput" placeholder="${placeholder}" autocomplete="off"><div class="popup-actions"><button class="popup-btn cancel" id="pC">${t('cancel')}</button><button class="popup-btn confirm" id="pK">${t('ok')}</button></div>`;
  ov.appendChild(p); document.body.appendChild(ov);
  const inp = p.querySelector('#pInput');
  setTimeout(() => inp.focus(), 100);
  const ok = () => { const v = inp.value.trim(); if (v && onSubmit) onSubmit(v); closePopup(ov); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  p.querySelector('#pC').onclick = () => closePopup(ov);
  p.querySelector('#pK').onclick = ok;
}

document.getElementById('minBtn').onclick = () => {
  appEl.classList.add('hide');
  setTimeout(() => {
    appEl.classList.remove('show');
    appEl.classList.remove('hide');
    appEl.style.display = 'none';
    setTimeout(() => {
      appEl.style.display = '';
      appEl.classList.add('show');
    }, 1400);
  }, 300);
};

document.getElementById('closeBtn').onclick = () => {
  askConfirm(t('closeTitle'), t('closeMsg'), () => {
    appEl.classList.add('hide');
    setTimeout(() => {
      appEl.classList.remove('show');
      appEl.classList.remove('hide');
      appEl.style.display = 'none';
    }, 300);
  });
};

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.onclick = () => {
    LANG = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.documentElement.lang = LANG;
    applyLang();
    renderCards();
    showNotif('Language', LANG === 'en' ? 'English' : 'Português', 'info');
  };
});

function applyLang() {
  document.getElementById('brandSub').textContent = t('brandSub');
  document.getElementById('loaderBadge').textContent = t('loaderBadge');
  document.querySelector('.activity-title').textContent = t('activityTitle');
  document.querySelector('.loader-footer span').textContent = t('loaderFooter');
  document.getElementById('bigTag').textContent = t('idLabel', {id:USER.id});
}

function updateUserName() {
  document.getElementById('chipName').textContent = USER.name;
  document.getElementById('bigName').innerHTML = `<span>${USER.name}</span>`;
}
updateUserName();

const loaderStage = document.getElementById('loaderStage');
const activityList = document.getElementById('activityList');
const MAX_ROWS = 5;
const rowRefs = {};
let lastIdx = -1;

function addActivityRow(idx) {
  const steps = I18N[LANG].loaderSteps;
  const s = steps[idx];
  const el = document.createElement('div');
  el.className = 'activity-row active';
  el.innerHTML = `<div class="adot"></div><div>${s.label}</div>`;
  activityList.appendChild(el);
  rowRefs[idx] = el;
  const vis = activityList.querySelectorAll('.activity-row:not(.leaving)');
  if (vis.length > MAX_ROWS) {
    const first = vis[0];
    first.classList.add('leaving'); first.classList.remove('active');
    setTimeout(() => first.remove(), 350);
  }
}
function markActivityDone(idx) {
  const el = rowRefs[idx];
  if (el) { el.classList.remove('active'); el.classList.add('done'); }
}

function startLoader() {
  loaderStage.classList.add('show');
  loaderStage.classList.remove('hide');
  const DUR = 6500, start = performance.now();
  const fill = document.getElementById('loaderFill');
  const pct = document.getElementById('loaderPct');
  const statusTxt = document.getElementById('loaderStatusText');
  const steps = I18N[LANG].loaderSteps;

  function tick() {
    const p = Math.min(1, (performance.now() - start) / DUR);
    const pVal = Math.floor(p * 100);
    fill.style.width = pVal + '%';
    pct.textContent = pVal + '%';
    let idx = 0;
    for (let i = 0; i < steps.length; i++) { if (pVal >= steps[i].at) idx = i; }
    if (idx !== lastIdx) {
      if (lastIdx >= 0) markActivityDone(lastIdx);
      if (idx < steps.length) { addActivityRow(idx); statusTxt.textContent = steps[idx].status; }
      lastIdx = idx;
    }
    if (p < 1) requestAnimationFrame(tick);
    else {
      markActivityDone(lastIdx);
      statusTxt.textContent = I18N[LANG].loaderSteps[I18N[LANG].loaderSteps.length-1].status;
      pct.textContent = '100%';
      setTimeout(() => {
        loaderStage.classList.add('hide');
        setTimeout(() => {
          loaderStage.classList.remove('show');
          loaderStage.classList.remove('hide');
          activityList.innerHTML = ''; lastIdx = -1;
          for (const k in rowRefs) delete rowRefs[k];
          appEl.classList.add('show');
          document.getElementById('watermark').classList.add('show');
          setTimeout(() => showNotif(t('welcomeTitle'), t('welcomeMsg', {user:USER.name}), 'success'), 300);
          setTimeout(() => showNotif(t('configTitle'), t('configMsg'), 'info'), 1000);
        }, 500);
      }, 300);
    }
  }
  requestAnimationFrame(tick);
}

applyLang();
renderCats();
renderTabs();
renderCards();
startLoader();
</script>
</body>
</html>
